/var/logs/nginx/*.log /var/logs/passenger/*.log {
    daily
    missingok
    rotate 7
    compress
    notifempty
    # logrotate runs as the unprivileged account that owns the logs (no ownership change is possible)
    create 0640
    sharedscripts
    postrotate
        # USR1 makes nginx reopen its log files; the pid file is the one nginx.conf declares.
        [ ! -f /tmp/nginx/nginx.pid ] || kill -USR1 "$(cat /tmp/nginx/nginx.pid)"
    endscript
}
