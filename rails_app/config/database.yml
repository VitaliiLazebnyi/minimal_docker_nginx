---
# SQLite: development and test only. The image configures its database with DATABASE_URL (Dockerfile) and does not
# ship this file (.dockerignore).
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# The production entry mirrors DATABASE_URL, so that the database configuration of every environment is
# specified (spec/rails_app/application_spec.rb).
production:
  <<: *default
  database: storage/production.sqlite3

# Erased and re-created by the suite: never the same file as development or production.
test:
  <<: *default
  database: storage/test.sqlite3
