# Maximum-strictness configuration. Every cop is run in "fail the build" mode.
# New code has no exclusions: fix the code. A cop that cannot apply to a file is configured narrowly
# below, with the reason. Inline RuboCop directives are forbidden (see
# Style/DisableCopsWithinSourceCodeDirective), and there is no todo file.
plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-sorbet
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - 'vendor/**/*'
    - 'coverage/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'storage/**/*'
    - 'doc/**/*'
    - '.yardoc/**/*'
    # Generated by Tapioca (`rake typecheck`): gem and DSL RBIs are rewritten on every run.
    - 'sorbet/rbi/gems/**/*'
    - 'sorbet/rbi/dsl/**/*'

# --- Optional (disabled-by-default) cops that make sense for this codebase ---
Layout/ClassStructure:
  Enabled: true
Layout/EmptyLineAfterMultilineCondition:
  Enabled: true
Layout/LineLength:
  Max: 120
Lint/NumberConversion:
  Enabled: true
Lint/RedundantCopDisableDirective:
  Enabled: true
Naming/InclusiveLanguage:
  Enabled: true
Performance/ChainArrayAllocation:
  Enabled: true
Sorbet/ForbidTUnsafe:
  Enabled: true
Sorbet/ForbidTUntyped:
  Enabled: true
  Include:
    - 'app/**/*.rb'
    - 'lib/**/*.rb'
Style/ConstantVisibility:
  Enabled: true
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
# Style/DocumentationMethod is intentionally NOT enabled: it requires the comment to sit
# directly above `def`, but Sorbet's `sig { ... }` must sit between them. Documentation
# completeness is enforced instead by the YARD gate (`yard stats` must report 100%).
Style/Documentation:
  Enabled: true
Style/InvertibleUnlessCondition:
  Enabled: true
Style/MethodCalledOnDoEndBlock:
  Enabled: true
Style/RequireOrder:
  Enabled: true
Style/Send:
  Enabled: true
Style/SingleLineBlockParams:
  Enabled: true
Style/StringHashKeys:
  Enabled: true

# --- Sorbet: strictest sigils that are reachable ---
# app/ and lib/ are `typed: strict` (every method has a signature, every constant a type).
Sorbet/StrictSigil:
  Enabled: true
  Include:
    - 'app/**/*.rb'
    - 'lib/**/*.rb'
Sorbet/EnforceSigilOrder:
  Enabled: true
Sorbet/EnforceSignatures:
  Enabled: true
  Include:
    - 'app/**/*.rb'
    - 'lib/**/*.rb'

# rubocop-md: README snippets are illustrative, not standalone programs.
Style/FrozenStringLiteralComment:
  Exclude:
    - '**/*.md'

# Request specs describe the controller they exercise, but are about the endpoint (HTTP verb and path),
# not about methods of the controller class.
RSpec/DescribeMethod:
  Exclude:
    - 'spec/requests/**/*.rb'

# The quality-gate tasks in the Rakefile shell out to external tools (RuboCop, Sorbet, YARD, Brakeman, ...)
# that load what they need themselves; making them depend on :environment would boot the application in
# development mode for nothing. The tasks in lib/tasks/ (none today) still get the cop.
Rails/RakeEnvironment:
  Exclude:
    - 'Rakefile'
