---
# Maximum-strictness configuration: every cop of RuboCop and of every plugin is enabled (EnabledByDefault),
# pending cops included (NewCops), and every offense fails the build. There is no todo file and no inline
# directive (Style/DisableCopsWithinSourceCodeDirective, script/forbidden_suppressions.sh). The few cops that
# are switched off, or kept away from some files, are listed below with the reason they cannot apply.
# Keys are in alphabetical order (yamllint key-ordering).
AllCops:
  EnabledByDefault: true
  Exclude:
    - .mutant/**/*
    - .yardoc/**/*
    - coverage/**/*
    - doc/**/*
    - log/**/*
    # Generated by Tapioca (`rake typecheck`): gem and DSL RBIs are rewritten on every run.
    - sorbet/rbi/dsl/**/*
    - sorbet/rbi/gems/**/*
    - storage/**/*
    - tmp/**/*
    - vendor/**/*
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0

# The continuation lines of a string are indented by one step rather than aligned with the string: editorconfig-checker
# requires every indentation to be a multiple of two spaces (.editorconfig), which an aligned string seldom is. The
# style of the other repositories of this owner.
Layout/LineEndStringConcatenationIndentation:
  EnforcedStyle: indented

# The same width as Markdown (rumdl MD013), YAML (yamllint) and every other file (.editorconfig), with no
# exception: a long URI, qualified name, heredoc line or directive is wrapped like any other line.
Layout/LineLength:
  AllowCopDirectives: false
  AllowHeredoc: false
  AllowQualifiedName: false
  AllowURI: false
  AllowedPatterns: []
  Max: 120

# Requires a leading `::` on every constant. Style/RedundantConstantBase (enabled) forbids exactly that prefix,
# and RuboCop documents the two as mutually exclusive; mutant would also turn each `::Name` into `Name`, an
# equivalent mutation that no test can kill.
Lint/ConstantResolution:
  Enabled: false

# Sorbet signatures name every parameter, including the block, so anonymous block forwarding (`&`) cannot be
# used in typed code.
Naming/BlockForwarding:
  EnforcedStyle: explicit

# Request specs describe the controller they exercise, but are about the endpoint (HTTP verb and path), not
# about methods of the controller class.
RSpec/DescribeMethod:
  Exclude:
    - spec/requests/**/*.rb

# The specs are `typed: strict`, so every memoized helper has a Sorbet signature: `sig { returns(...) }` right above
# each `let`. This cop reads every such `sig` as a statement between two `let`s, and its autocorrection moves the
# `let`s away from their signatures.
RSpec/ScatteredLet:
  Enabled: false

# script/ (inspected with this configuration by `rake rubocop`) is plain Ruby for the whole repository; it does
# not load Rails, so the Rails cops (which suggest ActiveSupport methods) do not apply to it.
Rails:
  Exclude:
    - ../script/**/*

# The quality-gate tasks in the Rakefile shell out to external tools (RuboCop, Sorbet, YARD, Brakeman, ...)
# that load what they need themselves; making them depend on :environment would boot the application for
# nothing (only `debride`, which reads the routes, does). The tasks in lib/tasks/ (none today) still get the cop.
Rails/RakeEnvironment:
  Exclude:
    - Rakefile

# These cops forbid the Sorbet signature syntax itself (`sig`, `extend T::Sig`, `T.let`, `T::Struct`, ...);
# they exist for code bases that write their types as RBS comments, which sorbet-runtime does not check at run
# time and yard-sorbet does not read. This repository uses runtime-checked signatures:
# Sorbet/EnforceSignatures (enabled) requires a `sig` on every method, and `typed: strict` a `T.let` on every
# constant.
Sorbet/ForbidSig:
  Enabled: false

Sorbet/ForbidSigWithRuntime:
  Enabled: false

Sorbet/ForbidTHelpers:
  Enabled: false

Sorbet/ForbidTLet:
  Enabled: false

Sorbet/ForbidTSig:
  Enabled: false

Sorbet/ForbidTStruct:
  Enabled: false

Sorbet/ForbidTTypeAlias:
  Enabled: false

Sorbet/ForbidTypeAliasedShapes:
  Enabled: false

Sorbet/RedundantExtendTSig:
  Enabled: false

# The sigil ladder (Sorbet runs on every file below, see sorbet/config). The application, the scripts and the
# rest of the configuration are `typed: strong` (no T.untyped value anywhere). Rails' environment files,
# application.rb, ci.rb and the parameter filter configure Rails through methods whose RBIs return T.untyped,
# and the specs (and the two spec helpers below) call RSpec matchers and mocks that do, so those files are
# `typed: strict` (still a signature on every method and a type on every constant).
Sorbet/StrictSigil:
  Exclude:
    - '**/*.md'
    # Evaluated by Rack::Builder and Puma with instance_eval: `run` and Puma's configuration methods are called
    # on an object Sorbet cannot know, so these two files are `typed: false`.
    - config.ru
    - config/puma.rb

Sorbet/StrongSigil:
  Exclude:
    - '**/*.md'
    - config.ru
    - config/application.rb
    - config/ci.rb
    - config/environments/*.rb
    - config/initializers/filter_parameter_logging.rb
    - config/puma.rb
    - spec/**/*_spec.rb
    - spec/rails_helper.rb
    - spec/spec_helper.rb
    # The spec helpers that set up RSpec mocks (`allow`, `receive`, `stub_const`) and parse canned HTTP responses
    # (Net::HTTPResponse.read_new): their RBIs return T.untyped, like the matchers the specs call.
    - spec/support/fake_https.rb
    - spec/support/script_repository.rb

Sorbet/TrueSigil:
  Exclude:
    - '**/*.md'
    - config.ru
    - config/puma.rb

# Every file is copyrighted by the author of the repository; Markdown code blocks are snippets, not files.
Style/Copyright:
  AutocorrectNotice: '# Copyright (c) 2026 Vitalii Lazebnyi'
  Exclude:
    - '**/*.md'
  Notice: ^# Copyright \(c\) 2026 Vitalii Lazebnyi$

# Requires the comment directly above `def`, but the Sorbet `sig` sits between them, and yard-sorbet takes a
# method's docstring from the comment above the `sig`. Every method's documentation is enforced by `rake yard`
# instead (100% documented, no warnings).
Style/DocumentationMethod:
  Enabled: false

# Style/MissingElse (enabled) requires an `else` on every `if` and `case`; with Style/EmptyElse at its default
# style ("both") the two cops contradict each other on `else nil`. The "empty" style still rejects an empty
# `else`.
Style/EmptyElse:
  EnforcedStyle: empty

# rubocop-md: README snippets are illustrative, not standalone programs.
Style/FrozenStringLiteralComment:
  Exclude:
    - '**/*.md'

# Neither style applies: "brackets" rewrites `hash.fetch(key)` into `hash[key]`, which turns the KeyError the
# document readers of script/ rely on (a document of an unexpected shape fails loudly) into a silent nil; "fetch"
# cannot tell a Hash from the String, MatchData and Array `[]` it also flags, and rewrites those into calls that
# do not exist.
Style/HashLookupMethod:
  Enabled: false

plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-sorbet
  - rubocop-thread_safety
  - rubocop-yard

# rubocop-ai (comment and code patterns of AI generators) is not a RuboCop plugin yet: it is loaded with
# `require`.
require:
  - rubocop-ai
