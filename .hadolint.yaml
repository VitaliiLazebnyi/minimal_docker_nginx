---
# Every finding fails the build, down to the lowest severity (style). No rule is switched off inline in the
# Dockerfile. Keys are in alphabetical order (yamllint key-ordering).
failure-threshold: style
ignored:
  # DL3018 (pin versions in `apk add`): the base image is pinned by digest, but Alpine's repositories keep
  # only the newest build of each package of a release branch, so a pinned `pkg=version` stops resolving as
  # soon as Alpine publishes a security fix and the image could no longer be rebuilt. The packages are the
  # current builds of the pinned Alpine release; the final image is scanned by Trivy and Grype, which fail on
  # any fixable vulnerability, and `rake outdated` fails when a newer Alpine release exists.
  - DL3018
# The image describes itself with the OCI annotations below (DL3049-DL3058); no other label is allowed.
label-schema:
  org.opencontainers.image.description: text
  org.opencontainers.image.source: url
  org.opencontainers.image.title: text
strict-labels: true
# Images come only from Docker Hub (the official ruby image), pinned by digest.
trustedRegistries:
  - docker.io
