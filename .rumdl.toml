# rumdl (https://github.com/rvben/rumdl) lints every Markdown file with every one of its rules, the markdownlint rules
# and its own, including the opt-in ones (`extend-enable` lists them all); there are no inline disable comments
# (script/forbidden_suppressions.sh). Three rules check nothing without a project-specific list, and this repository
# has none to give: MD043 (a heading structure every file must follow: the documents differ), MD072 (front-matter
# keys: no file has front matter) and MD096 (the column every table is sorted by: the tables are in reading order).
[global]
extend-enable = [
  "MD001", "MD003", "MD004", "MD005", "MD007", "MD009", "MD010", "MD011", "MD012", "MD013", "MD014", "MD018",
  "MD019", "MD020", "MD021", "MD022", "MD023", "MD024", "MD025", "MD026", "MD027", "MD028", "MD029", "MD030",
  "MD031", "MD032", "MD033", "MD034", "MD035", "MD036", "MD037", "MD038", "MD039", "MD040", "MD041", "MD042",
  "MD043", "MD044", "MD045", "MD046", "MD047", "MD048", "MD049", "MD050", "MD051", "MD052", "MD053", "MD054",
  "MD055", "MD056", "MD057", "MD058", "MD059", "MD060", "MD061", "MD062", "MD063", "MD064", "MD065", "MD066",
  "MD067", "MD068", "MD069", "MD070", "MD071", "MD072", "MD073", "MD074", "MD075", "MD076", "MD077", "MD078",
  "MD079", "MD080", "MD081", "MD082", "MD083", "MD084", "MD085", "MD086", "MD087", "MD088", "MD089", "MD090",
  "MD091", "MD092", "MD093", "MD094", "MD095", "MD096"
]
# Prose is wrapped at the same width as the code (RuboCop Layout/LineLength, yamllint, .editorconfig).
line-length = 120
respect-gitignore = true

# Every rule whose default only asks for consistency within a file is given the one style the repository uses, and
# every rule with a lenient default is tightened (in markdownlint-cli2's terms: the strictest settings any repository of
# this owner uses).

# ATX headings (`#`) everywhere.
[MD003]
style = "atx"

# Lists use dashes everywhere.
[MD004]
style = "dash"

# No trailing whitespace at all, not even the two-space hard line break.
[MD009]
br-spaces = 0
strict = true

# Prose, headings, code blocks and tables wrap at 120 columns.
[MD013]
code-blocks = true
headings = true
line-length = 120
tables = true

# No two headings of a document share their text, wherever they are.
[MD024]
siblings-only = false

# No heading ends with punctuation, a question mark included.
[MD026]
punctuation = ".,;:!?"

# Ordered lists are numbered 1, 2, 3.
[MD029]
style = "ordered"

# Horizontal rules are written `---`.
[MD035]
style = "---"

# Code blocks are fenced with backticks.
[MD046]
style = "fenced"

[MD048]
style = "backtick"

# Emphasis uses underscores, strong emphasis asterisks.
[MD049]
style = "underscore"

[MD050]
style = "asterisk"

# Link fragments match the case of the heading they point to.
[MD051]
ignore-case = false

# Shortcut reference links (`[label]`) must have a definition too.
[MD052]
shortcut-syntax = true

# Tables have a leading and a trailing pipe on every row.
[MD055]
style = "leading_and_trailing"

# The names of the tools and projects the documents mention, in their own spelling.
[MD044]
names = [
  "Brakeman", "BuildKit", "Dependabot", "Dockle", "GitHub", "Grype", "Passenger", "RuboCop", "RubyGems", "Sorbet",
  "SimpleCov", "Trivy", "YARD"
]

[MD060]
enabled = true

# Headings are in title case. The project name and "C/C++" are written as they are spelled.
[MD063]
enabled = true
ignore-words = ["C/C++", "minimal_docker_nginx"]
lowercase-words = [
  "a", "an", "and", "as", "at", "but", "by", "for", "from", "in", "into", "nor", "of", "off", "on", "or", "per", "so",
  "the", "to", "up", "via", "vs", "vs.", "with", "yet"
]

[MD073]
enabled = true
