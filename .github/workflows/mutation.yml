name: Mutation testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBYOPT: -W:deprecated -W:performance
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  mutant:
    name: Mutant
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rails_app
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Mutant parses the code with the `parser` gem (it requires `parser/current`), whose newest release
    # (3.3.13.0) has no grammar for Ruby 3.4 or 4.0 and warns on any Ruby other than 3.3.13. Mutation
    # testing therefore runs on Ruby 3.3.13 (a hold documented in script/outdated_holds.yml); the
    # application itself is tested on the Ruby of .ruby-version by the CI workflow.
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: "3.3.13"
        rubygems: latest
        bundler-cache: true
        working-directory: rails_app
    - name: Check the Ruby version
      run: ../script/check_ruby.sh 3.3.13
    # The application is small: every run mutates every subject (.mutant.yml). Any alive mutation fails.
    - name: Mutant (every subject)
      run: bundle exec rake mutant

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [mutant]
    runs-on: ubuntu-26.04
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Fail on any warning or deprecation in the logs of this run
      env:
        GH_TOKEN: ${{ github.token }}
        GATE_JOB_NAME: Warning gate
      run: script/warning_gate.sh
