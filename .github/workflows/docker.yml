---
# The Dockerfile (hadolint, BuildKit build checks, Trivy misconfiguration rules) and the image itself (structure
# tests, an end-to-end smoke test, Dockle, Trivy, Grype and gixy), through script/check.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  dockerfile:
    name: hadolint, BuildKit build checks, Trivy config
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.r2.cloudflarestorage.com:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: script/check hadolint buildkit trivy_config
        run: script/check hadolint buildkit trivy_config
    timeout-minutes: 15

  image:
    name: Build, test and scan the image
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            auth.docker.io:443
            cache.ruby-lang.org:443
            dl-cdn.alpinelinux.org:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            grype.anchore.io:443
            index.rubygems.org:443
            mirror.gcr.io:443
            nginx.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.x
      - name: Install gixy (tools/requirements.txt)
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r tools/requirements.txt
      # The image is compiled with -march=native (REQ-COMP-001): cached layers may only be reused on the same
      # CPU model, or the binaries could use instructions this runner lacks.
      - id: cpu
        name: Identify the CPU model
        run: |
          model=$(grep -m 1 '^model name' /proc/cpuinfo)
          digest=$(sha256sum <<< "${model}")
          echo "model=${digest:0:16}" >> "${GITHUB_OUTPUT}"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: >-
            image-${{ steps.cpu.outputs.model }}-${{ hashFiles('Dockerfile', '.dockerignore', 'docker_config/**',
            'rails_app/**') }}
          path: ${{ runner.temp }}/buildx-cache
          restore-keys: image-${{ steps.cpu.outputs.model }}-
      - env:
          BUILD_CACHE_FROM: type=local,src=${{ runner.temp }}/buildx-cache
          BUILD_CACHE_TO: type=local,dest=${{ runner.temp }}/buildx-cache-new,mode=max
          IMAGE: minimal-docker-nginx:ci
          REPORTS_DIR: ${{ runner.temp }}/reports
        name: script/check image
        run: script/check image
      # Saved even when a test or a scan fails (the build succeeded when the new cache exists), so the next run
      # does not rebuild the image from scratch.
      - id: new-cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        name: Replace the cache with the layers of this build
        run: |
          [[ -d "${RUNNER_TEMP}/buildx-cache-new" ]] || exit 0
          rm -rf "${RUNNER_TEMP}/buildx-cache"
          mv "${RUNNER_TEMP}/buildx-cache-new" "${RUNNER_TEMP}/buildx-cache"
          echo 'built=true' >> "${GITHUB_OUTPUT}"
      - if: ${{ !cancelled() && steps.new-cache.outputs.built == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: ${{ runner.temp }}/buildx-cache
      - if: ${{ !cancelled() }}
        name: Upload the reports and the build log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          if-no-files-found: ignore
          name: image-reports
          path: ${{ runner.temp }}/reports
    timeout-minutes: 120

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate
    needs:
      - dockerfile
      - image
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: Docker image

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 43 5 * * 1  # new vulnerabilities are published every day: rescan weekly
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the (read-only, unless stated) permissions it needs.
permissions: {}
