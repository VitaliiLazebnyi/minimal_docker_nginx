---
# The Rails application and the Ruby scripts: every job runs its checks through script/check, so a local
# `script/check` runs the same checks. Ruby warnings are on (RUBYOPT) for every command; script/check names the
# third-party tools that run without -w, and why.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  RUBYOPT: -w -W:deprecated -W:performance

jobs:
  docs:
    name: YARD (100% documented, no warnings)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - name: script/check yard
        run: script/check yard
    timeout-minutes: 15

  lint:
    name: RuboCop
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - name: script/check rubocop
        run: script/check rubocop
    timeout-minutes: 15

  # Every dependency must be at its newest release, except those on the documented hold list
  # (script/outdated_holds.yml): gems, Bundler, RubyGems, Ruby, nginx, Docker images, GitHub Actions, linters.
  outdated:
    name: Outdated dependencies
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            auth.docker.io:443
            cache.ruby-lang.org:443
            ghcr.io:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - name: script/check outdated
        run: script/check outdated
    timeout-minutes: 15

  smells:
    name: Reek, Flay, Flog, debride
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - name: script/check reek flay flog debride
        run: script/check reek flay flog debride
    timeout-minutes: 15

  # SimpleCov enforces 100% line and branch coverage; warnings, deprecations, pending and skipped examples fail
  # the run (spec/spec_helper.rb, config/environments/test.rb).
  test:
    name: RSpec (100% line and branch coverage)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - name: script/check spec
        run: script/check spec
    timeout-minutes: 15

  typecheck:
    name: Sorbet
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - name: script/check typecheck
        run: script/check typecheck
    timeout-minutes: 15

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate
    needs:
      - docs
      - lint
      - outdated
      - smells
      - test
      - typecheck
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: CI

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the (read-only, unless stated) permissions it needs.
permissions: {}
