---
# Known vulnerabilities and secrets: bundler-audit and Brakeman (the application), Semgrep (every file, with the rule
# packs of every language of the repository), Trivy (every lockfile and the working tree), gitleaks (the whole
# history), and dependency review on every pull request.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  RUBYOPT: -w -W:deprecated -W:performance

jobs:
  # Every check, no ignore file (rails_app/config/brakeman.ignore is forbidden), zero warnings.
  brakeman:
    name: Brakeman
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - name: script/check brakeman
        run: script/check brakeman
    timeout-minutes: 15

  bundler-audit:
    name: bundler-audit
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - name: script/check audit
        run: script/check audit
    timeout-minutes: 15

  # Requires the repository's dependency graph (Settings > Code security).
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write  # post the dependency review summary on the pull request
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            rubygems.org:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-scopes: development, runtime, unknown
          fail-on-severity: low
          # The action can only warn about a low OpenSSF Scorecard, and has no per-package allowance. The
          # threshold (3) is enforced by script/scorecards.rb (`rake scorecards`) below instead, which fails on a
          # low-scoring added dependency unless script/scorecard_allowances.yml allows that one package, with its
          # reason.
          show-openssf-scorecard: false
      # On a cache miss, RubyGems' installer warns under -w and -W:performance (rubygems/specification.rb):
      # only the installation of the bundle runs without those, every command of the repository has them.
      - env:
          RUBYOPT: -W:deprecated
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
          working-directory: rails_app
      - env:
          DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
        name: OpenSSF Scorecard of every added dependency (threshold 3, per-package allowances)
        run: bundle exec rake scorecards
        working-directory: rails_app
    timeout-minutes: 15

  gitleaks:
    name: Secret scanning (gitleaks, full history)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.r2.cloudflarestorage.com:443
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: script/check gitleaks
        run: script/check gitleaks
    timeout-minutes: 10

  # Semgrep runs in its pinned image (tools/images.json), started from a step rather than as the job's container so
  # Harden-Runner guards the job.
  semgrep:
    name: Semgrep
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.r2.cloudflarestorage.com:443
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            semgrep.dev:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: script/check semgrep
        run: script/check semgrep
    timeout-minutes: 15

  trivy-fs:
    name: Trivy (lockfiles and working tree)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.r2.cloudflarestorage.com:443
            auth.docker.io:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Trivy reads the licenses of the Python packages from an installed environment (it warns without one),
      # so the tools are installed and Trivy runs on the runner: its binary is copied out of the pinned image.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.x
      - name: Install the Python tools (tools/requirements.txt)
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r tools/requirements.txt
      - name: Install Trivy from its pinned image (tools/images.json)
        run: |
          image=$(jq --raw-output '.trivy | "\(.name):\(.tag)@\(.digest)"' tools/images.json)
          mkdir -p "${RUNNER_TEMP}/tools"
          container=$(docker create "${image}")
          docker cp "${container}:/usr/local/bin/trivy" "${RUNNER_TEMP}/tools/trivy"
          docker rm "${container}"
          echo "${RUNNER_TEMP}/tools" >> "${GITHUB_PATH}"
      - name: script/check trivy_fs
        run: script/check trivy_fs
    timeout-minutes: 15

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Security)
    needs:
      - brakeman
      - bundler-audit
      - dependency-review
      - gitleaks
      - semgrep
      - trivy-fs
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate (Security)
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: Security

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 17 4 * * 1  # new advisories are published every day: rescan weekly
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the (read-only, unless stated) permissions it needs.
permissions: {}
