---
# The repository itself: workflows (actionlint, with ShellCheck on every run: block; zizmor, auditor persona,
# with its online audits), shell scripts (ShellCheck with every optional check; shfmt), spelling (typos),
# Markdown (rumdl, every rule; lychee, every link and anchor), YAML (yamllint, every rule, strict), EditorConfig and
# inline suppressions. The linters come from tools/requirements.txt (pinned with hashes), tools/binaries.json (pinned
# by SHA-256) and tools/images.json (pinned by digest).

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # lychee runs in its pinned image (tools/images.json), started from a step so Harden-Runner guards the job; the
  # allow-list names the hosts the Markdown files link to.
  links:
    name: Links (lychee, every link and anchor)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.r2.cloudflarestorage.com:443
            api.github.com:443
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            scorecard.dev:443
          disable-sudo: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}  # lychee checks the links to GitHub through its API
        name: script/check lychee
        run: script/check lychee
    timeout-minutes: 10

  lint:
    name: Repository linters
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.x
      - name: Install the linters (tools/requirements.txt)
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r tools/requirements.txt
      - name: Install the linters (tools/binaries.json)
        run: script/install_binaries.sh
      - env:
          GH_TOKEN: ${{ github.token }}  # zizmor: online audits (known-vulnerable actions, impostor commits)
        name: script/check suppressions actionlint zizmor shellcheck shfmt typos rumdl yamllint editorconfig
        run: script/check suppressions actionlint zizmor shellcheck shfmt typos rumdl yamllint editorconfig
    timeout-minutes: 10

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Lint)
    needs:
      - links
      - lint
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress allow-list)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate (Lint)
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: Lint

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

# Nothing is writable by default; every job declares the (read-only, unless stated) permissions it needs.
permissions: {}
