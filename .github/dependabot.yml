---
# Dependabot proposes every update; `rake outdated` (CI) fails while any dependency is outdated and not on the
# documented hold list (script/outdated_holds.yml).

updates:
  - cooldown:
      default-days: 7
    directory: /rails_app
    groups:
      development-dependencies:
        dependency-type: development
    package-ecosystem: bundler
    schedule:
      interval: weekly
  - cooldown:
      default-days: 7
    directory: /
    package-ecosystem: docker
    schedule:
      interval: weekly
  - cooldown:
      default-days: 7
    directory: /
    groups:
      github-actions:
        patterns:
          - '*'
    package-ecosystem: github-actions
    schedule:
      interval: weekly
  - cooldown:
      default-days: 7
    directory: /tools
    groups:
      linters:
        patterns:
          - '*'
    package-ecosystem: pip
    schedule:
      interval: weekly
version: 2
